# NVIDIA GPU acceleration for embeddings (indexing and chat questions).
#
# Requirements on the host: an NVIDIA driver and the NVIDIA Container Toolkit.
# In .env:
#   TORCH_VARIANT=cu124                                   # CUDA build of PyTorch
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml # so plain `docker compose` includes this file
# Then: docker compose up -d --build
# and choose "GPU" in Settings → Compute device.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  app:
    <<: *gpu
  worker:
    <<: *gpu
