[project]
name = "website-assistant"
version = "0.1.0"
description = "Multi-client AI website assistant (chat widget + admin UI)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No cache provider: /srv is read-only for the app user inside the container.
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    # Starlette's TestClient uses an alias deprecated by newer anyio; harmless.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: needs the real Postgres database (skipped automatically when unreachable)",
]
