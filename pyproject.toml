[project]
name = "website-assistant"
version = "0.1.0"
description = "Multi-client AI website assistant (chat widget + admin UI)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No cache provider: /srv is read-only for the app user inside the container.
addopts = "-ra -p no:cacheprovider"
filterwarnings = [
    # Starlette's TestClient uses an alias deprecated by newer anyio; harmless.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # Generated column (chunks.content_tsv) is compared by autogenerate; expected.
    "ignore:Computed default on chunks.content_tsv cannot be modified:UserWarning",
    "ignore:Did not recognize type .vector. of column .embedding.",
]
markers = [
    "integration: needs the real Postgres database (skipped automatically when unreachable)",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI's Depends()/File() defaults are idiomatic.
ignore = ["E501", "B008"]
