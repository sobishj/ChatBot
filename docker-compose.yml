# Website Assistant
#   docker compose up -d                    -> db + app + worker
#   docker compose --profile https up -d    -> also Caddy with automatic HTTPS
name: website-assistant

# Shared settings for the app and worker (same image, different command).
x-app-common: &app-common
  image: website-assistant:latest
  build:
    context: .
    args:
      INSTALL_DEV: ${INSTALL_DEV:-false}
  env_file: .env
  environment:
    DATA_DIR: /data
    WATCHED_DIR: /mnt/watched
    HF_HOME: /data/models # embedding model cache, shared by app and worker
  volumes:
    - appdata:/data
    # Watched document folders (on-premise). Read-only: we never modify client files.
    - ${WATCHED_HOST_DIR:-./watched}:/mnt/watched:ro
  extra_hosts:
    # Lets containers reach services on the host (e.g. a local LLM) on Linux too;
    # Docker Desktop provides this name automatically.
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # No published port: only the app and worker talk to the database.

  app:
    <<: *app-common
    command: ["python", "-m", "app.server"]
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8000}:${APP_PORT:-8000}"
      - "${ADMIN_BIND_IP:-0.0.0.0}:${ADMIN_PORT:-8001}:${ADMIN_PORT:-8001}"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app-common
    command: ["python", "-m", "app.worker"]

  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["https"]
    environment:
      # Required when this profile is enabled (compose can't enforce it per profile).
      HTTPS_PUBLIC_DOMAIN: ${HTTPS_PUBLIC_DOMAIN:-}
      HTTPS_ADMIN_DOMAIN: ${HTTPS_ADMIN_DOMAIN:-}
      APP_PORT: ${APP_PORT:-8000}
      ADMIN_PORT: ${ADMIN_PORT:-8001}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
